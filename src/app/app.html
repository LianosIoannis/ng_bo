<div class="flex min-h-dvh flex-col bg-slate-100">
  <header class="flex h-14 shrink-0 items-center border-b border-slate-200 bg-white px-4 shadow-sm">
    <button type="button"
      class="inline-flex size-10 items-center justify-center rounded-lg text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-600 focus-visible:ring-offset-2"
      aria-label="Open navigation menu" aria-controls="main-menu-drawer" [attr.aria-expanded]="menuOpen()"
      (click)="openMenu()">
      <fa-icon [icon]="menuIcon" aria-hidden="true"></fa-icon>
    </button>

    <h1 class="ml-3 text-base font-semibold text-slate-900">Backoffice</h1>
  </header>

  <main class="flex-1" aria-label="Workspace"></main>

  @if (menuOpen()) {
  <div class="fixed inset-0 z-30 bg-slate-950/45" aria-hidden="true" (click)="closeMenu()"></div>
  }

  <aside id="main-menu-drawer" tabindex="-1"
    class="fixed inset-y-0 left-0 z-40 w-80 max-w-[85vw] transform shadow-2xl transition-transform duration-300 ease-in-out focus:outline-none motion-reduce:transition-none"
    [class.-translate-x-full]="!menuOpen()" [class.translate-x-0]="menuOpen()"
    [attr.inert]="menuOpen() ? null : ''" aria-label="Main navigation">
    @if (menuData(); as data) {
    <menu [menuData]="data" (onCloseClicked)="closeMenu()" (onItemClicked)="closeMenu()"></menu>
    } @else if (menuData() === undefined) {
    <div class="flex h-full items-center justify-center bg-slate-900 px-6 text-sm text-slate-200" role="status">
      Loading menu…
    </div>
    } @else {
    <div class="flex h-full items-center justify-center bg-slate-900 px-6 text-center text-sm text-slate-200"
      role="alert">
      The menu could not be loaded.
    </div>
    }
  </aside>
</div>
